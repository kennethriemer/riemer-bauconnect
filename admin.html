<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riemer BauConnect – Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#171717;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:24px;
}

h1{
  margin:0;
  font-size:36px;
}

.brand{
  color:#ffd000;
}

.subtitle{
  color:#aaa;
  font-size:20px;
  margin:8px 0 30px;
}

.card{
  background:#222;
  border:1px solid #3a3a3a;
  border-radius:20px;
  padding:24px;
  margin-bottom:20px;
}

input,button{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #444;
  font-size:16px;
}

input{
  background:#111;
  color:#fff;
  margin:8px 0 15px;
}

button{
  background:#ffd000;
  color:#111;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:#333;
  color:#fff;
}

button:hover{
  opacity:.9;
}

.hidden{
  display:none;
}

.error{
  background:#6b2222;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

.success{
  background:#235c32;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

.table-wrap{
  overflow-x:auto;
  margin-top:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th{
  color:#ffd000;
  text-align:left;
  padding:12px;
  border-bottom:1px solid #444;
}

td{
  padding:12px;
  border-bottom:1px solid #333;
  vertical-align:top;
}

.small{
  color:#aaa;
  font-size:14px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.topbar button{
  width:auto;
  padding:12px 20px;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:8px;
  background:#333;
}

@media(max-width:600px){
  .wrap{
    padding:16px;
  }

  h1{
    font-size:30px;
  }

  .topbar{
    align-items:flex-start;
    flex-direction:column;
  }

  .topbar button{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <h1>
    RIEMER <span class="brand">BAUCONNECT</span>
  </h1>

  <div class="subtitle">
    Verwaltungsbereich – Bauanfragen
  </div>


  <!-- LOGIN -->

  <div id="loginBox" class="card">

    <h2>Admin-Login</h2>

    <label>E-Mail</label>
    <input
      id="email"
      type="email"
      placeholder="E-Mail-Adresse"
      autocomplete="username"
    >

    <label>Passwort</label>
    <input
      id="password"
      type="password"
      placeholder="Passwort"
      autocomplete="current-password"
    >

    <button id="loginBtn">
      Anmelden
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- ADMIN -->

  <div id="adminBox" class="hidden">

    <div class="topbar">

      <div>
        <h2 style="margin:0">Bauanfragen</h2>
        <div class="small">
          Eingegangene Kundenanfragen
        </div>
      </div>

      <button
        id="logoutBtn"
        class="secondary"
      >
        Abmelden
      </button>

    </div>


    <div class="card">

      <button id="refreshBtn">
        Aktualisieren
      </button>

      <div id="message"></div>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Datum</th>
              <th>Leistung</th>
              <th>PLZ</th>
              <th>Gebiet</th>
              <th>Beschreibung</th>
              <th>Name</th>
              <th>Telefon</th>
              <th>E-Mail</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="requestBody">
          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://ehzugjmltfcvllftpjpp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Ieo0pxh7y8L4nr2xMS7fQQ_mPonnlOm";

const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const loginBox =
  document.getElementById("loginBox");

const adminBox =
  document.getElementById("adminBox");

const loginMessage =
  document.getElementById("loginMessage");

const message =
  document.getElementById("message");

const requestBody =
  document.getElementById("requestBody");


/* LOGIN */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  loginMessage.innerHTML = "";

  if(!email || !password){

    loginMessage.innerHTML =
      '<div class="error">Bitte E-Mail und Passwort eingeben.</div>';

    return;
  }

  const {error} =
    await client.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    loginMessage.innerHTML =
      '<div class="error">' +
      escapeHtml(error.message) +
      '</div>';

    return;
  }

  updateUI();
}


/* LOGOUT */

async function logout(){

  await client.auth.signOut();

  updateUI();
}


/* DATEN LADEN */

async function loadRequests(){

  message.innerHTML =
    '<div class="success">Bauanfragen werden geladen...</div>';

  requestBody.innerHTML = "";

  const {data,error} =
    await client
      .from("Bauanfragen")
      .select("*")
      .order("created_at", {
        ascending:false
      });

  if(error){

    message.innerHTML =
      '<div class="error">' +
      "Bauanfragen konnten nicht geladen werden: " +
      escapeHtml(error.message) +
      '</div>';

    return;
  }

  if(!data || data.length === 0){

    message.innerHTML =
      '<div class="success">Noch keine Bauanfragen vorhanden.</div>';

    return;
  }

  message.innerHTML = "";

  data.forEach(row => {

    const tr =
      document.createElement("tr");

    tr.innerHTML = `
      <td>
        ${escapeHtml(formatDate(row.created_at))}
      </td>

      <td>
        <strong>
          ${escapeHtml(row.service || "")}
        </strong>
      </td>

      <td>
        ${escapeHtml(row.plz || "")}
      </td>

      <td>
        ${escapeHtml(row.area || "")}
      </td>

      <td>
        ${escapeHtml(row.description || "")}
      </td>

      <td>
        ${escapeHtml(row.name || "")}
      </td>

      <td>
        ${escapeHtml(row.phone || "")}
      </td>

      <td>
        ${escapeHtml(row.email || "")}
      </td>

      <td>
        <span class="status">
          ${escapeHtml(row.status || "")}
        </span>
      </td>
    `;

    requestBody.appendChild(tr);

  });

}


/* UI */

async function updateUI(){

  const {
    data:{
      session
    }
  } = await client.auth.getSession();

  if(session){

    loginBox.classList.add("hidden");

    adminBox.classList.remove("hidden");

    loadRequests();

  }else{

    loginBox.classList.remove("hidden");

    adminBox.classList.add("hidden");

  }

}


/* HILFSFUNKTIONEN */

function formatDate(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value);

  return date.toLocaleString(
    "de-DE",
    {
      dateStyle:"short",
      timeStyle:"medium"
    }
  );
}


function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* BUTTONS */

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    login
  );

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    logout
  );

document
  .getElementById("refreshBtn")
  .addEventListener(
    "click",
    loadRequests
  );


client.auth.onAuthStateChange(
  () => {
    updateUI();
  }
);


updateUI();

</script>

</body>
</html>
