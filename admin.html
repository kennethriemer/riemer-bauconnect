<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#171717"
>

<title>
Riemer BauConnect – Admin
</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  background: #171717;

  color: #fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}


.wrap {

  max-width: 1000px;

  margin: auto;

  padding: 20px;

}


h1 {

  margin: 0 0 6px;

  font-size: 30px;

}


h2 {

  margin-top: 0;

  font-size: 25px;

}


h3 {

  margin-top: 0;

}


.small {

  color: #aaa;

  margin-bottom: 20px;

}


.card {

  background: #222;

  border: 1px solid #444;

  border-radius: 14px;

  padding: 18px;

  margin-bottom: 15px;

}


input,
textarea,
select,
button {

  width: 100%;

  padding: 14px;

  border-radius: 10px;

  border: 1px solid #555;

  font-size: 16px;

}


input,
textarea,
select {

  background: #111;

  color: #fff;

}


textarea {

  min-height: 100px;

  resize: vertical;

}


button {

  background: #ffd400;

  color: #111;

  border: 0;

  font-weight: bold;

  cursor: pointer;

}


button:hover {

  opacity: .9;

}


button.secondary {

  background: #333;

  color: #fff;

}


button.danger {

  background: #b42318;

  color: #fff;

}


button.success {

  background: #087443;

  color: #fff;

}


.login {

  max-width: 450px;

  margin: 70px auto;

  padding: 20px;

}


.login input {

  margin-bottom: 12px;

}


.hidden {

  display: none !important;

}


.error {

  color: #ff7070;

  margin-top: 12px;

  white-space: pre-wrap;

}


.success {

  color: #66e08a;

  margin-top: 12px;

  white-space: pre-wrap;

}


.header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 15px;

  margin-bottom: 20px;

}


.header button {

  width: auto;

  padding: 12px 18px;

}


.tabs {

  display: flex;

  gap: 10px;

  margin-bottom: 20px;

}


.tab {

  width: auto;

  background: #333;

  color: #fff;

  padding: 13px 18px;

}


.tab.active {

  background: #ffd400;

  color: #111;

}


.loading {

  color: #aaa;

  padding: 20px 0;

}


.empty {

  color: #aaa;

  text-align: center;

  padding: 30px;

}


.request {

  cursor: pointer;

  transition: .15s;

}


.request:hover {

  border-color: #ffd400;

  transform: translateY(-1px);

}


.request-title {

  font-size: 20px;

  font-weight: bold;

  margin-bottom: 8px;

}


.request-info {

  color: #bbb;

  line-height: 1.6;

}


.status {

  display: inline-block;

  padding: 7px 12px;

  border-radius: 20px;

  margin-top: 10px;

  font-size: 14px;

  font-weight: bold;

}


.status-neu {

  background: #d8aa00;

  color: #111;

}


.status-kontakt {

  background: #2478d8;

}


.status-angebot {

  background: #e87818;

}


.status-auftrag {

  background: #239447;

}


.status-erledigt {

  background: #555;

}


.detail-row {

  border-bottom: 1px solid #444;

  padding: 13px 0;

}


.detail-label {

  color: #aaa;

  font-size: 13px;

  margin-bottom: 5px;

}


.detail-value {

  white-space: pre-wrap;

  word-break: break-word;

}


.back {

  background: #333;

  color: #fff;

  margin-bottom: 15px;

}


.firm {

  background: #222;

  border: 1px solid #444;

  border-radius: 14px;

  padding: 18px;

  margin-bottom: 12px;

}


.firm-title {

  font-size: 21px;

  font-weight: bold;

  margin-bottom: 8px;

}


.firm-info {

  color: #bbb;

  line-height: 1.7;

}


.firm-actions {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

  margin-top: 15px;

}


.form-grid {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 14px;

}


.form-group {

  margin-bottom: 5px;

}


.form-group.full {

  grid-column: 1 / -1;

}


.form-group label {

  display: block;

  color: #ccc;

  font-weight: bold;

  margin-bottom: 7px;

}


.form-buttons {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

  margin-top: 15px;

}


.checkbox-row {

  display: flex;

  align-items: center;

  gap: 10px;

  margin-top: 10px;

}


.checkbox-row input {

  width: 22px;

  height: 22px;

}


.section-title {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

}


.section-title button {

  width: auto;

}


@media (max-width: 650px) {

  .wrap {

    padding: 14px;

  }


  .header {

    align-items: flex-start;

  }


  .header button {

    flex-shrink: 0;

  }


  .tabs {

    display: grid;

    grid-template-columns: 1fr 1fr;

  }


  .tab {

    width: 100%;

  }


  .form-grid {

    grid-template-columns: 1fr;

  }


  .form-group.full {

    grid-column: auto;

  }


  .firm-actions {

    grid-template-columns: 1fr;

  }


  .form-buttons {

    grid-template-columns: 1fr;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN
     ===================================================== -->

<div
  id="loginScreen"
  class="login"
>

  <div class="card">

    <h1>
      Riemer BauConnect
    </h1>

    <div class="small">
      Adminbereich
    </div>


    <input
      id="email"
      type="email"
      placeholder="E-Mail"
      autocomplete="username"
    >


    <input
      id="password"
      type="password"
      placeholder="Passwort"
      autocomplete="current-password"
    >


    <button onclick="login()">
      Einloggen
    </button>


    <div
      id="loginError"
      class="error"
    ></div>

  </div>

</div>



<!-- =====================================================
     ADMIN
     ===================================================== -->

<div
  id="adminScreen"
  class="wrap hidden"
>


  <!-- HEADER -->

  <div class="header">

    <div>

      <h1>
        Riemer BauConnect
      </h1>

      <div class="small">
        Adminbereich
      </div>

    </div>


    <button
      onclick="logout()"
      class="secondary"
    >
      Abmelden
    </button>

  </div>



  <!-- ===================================================
       TABS
       =================================================== -->

  <div class="tabs">

    <button
      id="tabRequests"
      class="tab active"
      onclick="showRequestsTab()"
    >
      🏗️ Bauanfragen
    </button>


    <button
      id="tabFirms"
      class="tab"
      onclick="showFirmsTab()"
    >
      🏢 Fachbetriebe
    </button>

  </div>



  <!-- ===================================================
       BAUANFRAGEN
       =================================================== -->

  <div id="requestsSection">


    <!-- LISTE -->

    <div id="listView">

      <div class="card">

        <div class="section-title">

          <h2>
            Bauanfragen
          </h2>

          <button
            onclick="loadRequests()"
            style="width:auto"
          >
            ↻ Aktualisieren
          </button>

        </div>


        <div
          id="loading"
          class="loading"
        >
          Lade Bauanfragen...
        </div>


        <div
          id="requests"
        ></div>

      </div>

    </div>



    <!-- DETAIL -->

    <div
      id="detailView"
      class="hidden"
    >

      <button
        class="back"
        onclick="showList()"
      >
        ← Zurück zu den Bauanfragen
      </button>


      <div class="card">

        <h2 id="detailTitle">
          Bauanfrage
        </h2>


        <div class="detail-row">

          <div class="detail-label">
            Leistung
          </div>

          <div
            id="detailService"
            class="detail-value"
          ></div>

        </div>


        <div class="detail-row">

          <div class="detail-label">
            Datum
          </div>

          <div
            id="detailDate"
            class="detail-value"
          ></div>

        </div>


        <div class="detail-row">

          <div class="detail-label">
            PLZ
          </div>

          <div
            id="detailPlz"
            class="detail-value"
          ></div>

        </div>


        <div class="detail-row">

          <div class="detail-label">
            Ort / Bereich
          </div>

          <div
            id="detailArea"
            class="detail-value"
          ></div>

        </div>


        <div class="detail-row">

          <div class="detail-label">
            Beschreibung
          </div>

          <div
            id="detailDescription"
            class="detail-value"
          ></div>

        </div>


        <div class="detail-row">

          <div class="detail-label">
            Name
          </div>

          <div
            id="detailName"
            class="detail-value"
          ></div>

        </div>


        <div class="detail-row">

          <div class="detail-label">
            Telefon
          </div>

          <div
            id="detailPhone"
            class="detail-value"
          ></div>

        </div>


        <div class="detail-row">

          <div class="detail-label">
            E-Mail
          </div>

          <div
            id="detailEmail"
            class="detail-value"
          ></div>

        </div>


        <!-- STATUS -->

        <div class="detail-row">

          <div class="detail-label">
            Status ändern
          </div>


          <select id="statusSelect">

            <option value="neu">
              🟡 Neu
            </option>

            <option value="kontakt">
              🔵 Kontakt aufgenommen
            </option>

            <option value="angebot">
              🟠 Angebot
            </option>

            <option value="auftrag">
              🟢 Auftrag
            </option>

            <option value="erledigt">
              ⚫ Erledigt
            </option>

          </select>


          <br>
          <br>


          <button
            onclick="saveStatus()"
          >
            Status speichern
          </button>


          <div
            id="statusMessage"
          ></div>

        </div>


      </div>

    </div>

  </div>



  <!-- ===================================================
       FACHBETRIEBE
       =================================================== -->

  <div
    id="firmsSection"
    class="hidden"
  >


    <!-- FIRMENLISTE -->

    <div
      id="firmsListView"
    >

      <div class="card">

        <div class="section-title">

          <h2>
            Fachbetriebe
          </h2>

          <button
            onclick="openNewFirm()"
            style="width:auto"
          >
            ➕ Fachbetrieb
          </button>

        </div>


        <div
          id="firmsLoading"
          class="loading"
        >
          Lade Fachbetriebe...
        </div>


        <div
          id="firms"
        ></div>

      </div>

    </div>



    <!-- FIRMENFORMULAR -->

    <div
      id="firmFormView"
      class="hidden"
    >

      <button
        class="back"
        onclick="showFirmsList()"
      >
        ← Zurück zu den Fachbetrieben
      </button>


      <div class="card">

        <h2 id="firmFormTitle">
          Fachbetrieb hinzufügen
        </h2>


        <div class="form-grid">


          <!-- FIRMA -->

          <div class="form-group">

            <label for="firmFirma">
              Firmenname *
            </label>

            <input
              id="firmFirma"
              type="text"
              placeholder="z. B. Muster Tiefbau GmbH"
            >

          </div>


          <!-- INHABER -->

          <div class="form-group">

            <label for="firmInhaber">
              Inhaber
            </label>

            <input
              id="firmInhaber"
              type="text"
              placeholder="Vor- und Nachname"
            >

          </div>


          <!-- EMAIL -->

          <div class="form-group">

            <label for="firmEmail">
              E-Mail
            </label>

            <input
              id="firmEmail"
              type="email"
              placeholder="firma@example.de"
            >

          </div>


          <!-- TELEFON -->

          <div class="form-group">

            <label for="firmTelefon">
              Telefon
            </label>

            <input
              id="firmTelefon"
              type="tel"
              placeholder="0461 123456"
            >

          </div>


          <!-- PLZ -->

          <div class="form-group">

            <label for="firmPlz">
              PLZ
            </label>

            <input
              id="firmPlz"
              type="text"
              inputmode="numeric"
              maxlength="5"
              placeholder="24955"
            >

          </div>


          <!-- ORT -->

          <div class="form-group">

            <label for="firmOrt">
              Ort
            </label>

            <input
              id="firmOrt"
              type="text"
              placeholder="Harrislee"
            >

          </div>


          <!-- LEISTUNGEN -->

          <div class="form-group full">

            <label for="firmLeistungen">
              Leistungen
            </label>

            <textarea
              id="firmLeistungen"
              placeholder="Straßenbau, Asphaltarbeiten, Pflasterarbeiten..."
            ></textarea>

          </div>


          <!-- RADIUS -->

          <div class="form-group">

            <label for="firmRadius">
              Radius in km
            </label>

            <input
              id="firmRadius"
              type="number"
              min="0"
              max="500"
              value="30"
              placeholder="30"
            >

          </div>


          <!-- AKTIV -->

          <div class="form-group">

            <label>
              Status
            </label>

            <div class="checkbox-row">

              <input
                id="firmAktiv"
                type="checkbox"
                checked
              >

              <span>
                Fachbetrieb ist aktiv
              </span>

            </div>

          </div>


        </div>


        <div
          id="firmFormError"
          class="error"
        ></div>


        <div
          id="firmFormSuccess"
          class="success"
        ></div>


        <div class="form-buttons">

          <button
            onclick="saveFirm()"
          >
            💾 Speichern
          </button>


          <button
            class="secondary"
            onclick="showFirmsList()"
          >
            Abbrechen
          </button>

        </div>

      </div>

    </div>

  </div>


</div>



<script>


/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://ehzugjmltfcvllftpjpp.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_Ieo0pxh7y8L4nr2xMS7fQQ_mPonnlOm";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =====================================================
   VARIABLEN
   ===================================================== */

let currentRequest =
  null;


let currentFirm =
  null;



/* =====================================================
   LOGIN
   ===================================================== */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  const error =
    document
      .getElementById("loginError");


  error.textContent =
    "";


  if (!email || !password) {

    error.textContent =
      "Bitte E-Mail und Passwort eingeben.";

    return;

  }


  const {
    error: loginError
  } =
    await supabaseClient.auth
      .signInWithPassword({

        email:
          email,

        password:
          password

      });


  if (loginError) {

    error.textContent =
      loginError.message;

    return;

  }


  showAdmin();

}



/* =====================================================
   LOGOUT
   ===================================================== */

async function logout() {

  await supabaseClient.auth.signOut();


  document
    .getElementById("adminScreen")
    .classList.add("hidden");


  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

}



/* =====================================================
   ADMIN ANZEIGEN
   ===================================================== */

function showAdmin() {

  document
    .getElementById("loginScreen")
    .classList.add("hidden");


  document
    .getElementById("adminScreen")
    .classList.remove("hidden");


  showRequestsTab();

}



/* =====================================================
   TABS
   ===================================================== */

function showRequestsTab() {

  document
    .getElementById("requestsSection")
    .classList.remove("hidden");


  document
    .getElementById("firmsSection")
    .classList.add("hidden");


  document
    .getElementById("tabRequests")
    .classList.add("active");


  document
    .getElementById("tabFirms")
    .classList.remove("active");


  showList();


  loadRequests();

}



function showFirmsTab() {

  document
    .getElementById("requestsSection")
    .classList.add("hidden");


  document
    .getElementById("firmsSection")
    .classList.remove("hidden");


  document
    .getElementById("tabRequests")
    .classList.remove("active");


  document
    .getElementById("tabFirms")
    .classList.add("active");


  showFirmsList();


  loadFirms();

}



/* =====================================================
   BAUANFRAGEN LADEN
   ===================================================== */

async function loadRequests() {

  const loading =
    document
      .getElementById("loading");


  const container =
    document
      .getElementById("requests");


  loading.style.display =
    "block";


  container.innerHTML =
    "";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("bauanfragen")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  loading.style.display =
    "none";


  if (error) {

    container.innerHTML =
      `
      <div class="error">
        Fehler beim Laden:
        ${escapeHtml(error.message)}
      </div>
      `;

    return;

  }


  if (!data || data.length === 0) {

    container.innerHTML =
      `
      <div class="empty">
        Keine Bauanfragen vorhanden.
      </div>
      `;

    return;

  }


  data.forEach(
    request => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "card request";


      const status =
        request.status ||
        "neu";


      item.innerHTML =
        `

        <div class="request-title">

          ${escapeHtml(
            request.service ||
            "Bauanfrage"
          )}

        </div>


        <div class="request-info">

          PLZ:
          ${escapeHtml(
            request.plz ||
            "-"
          )}

          <br>

          ${escapeHtml(
            request.name ||
            "-"
          )}

          <br>

          ${formatDate(
            request.created_at
          )}

        </div>


        <span
          class="status
          ${getStatusClass(status)}"
        >

          ${getStatusText(status)}

        </span>

        `;


      item.addEventListener(
        "click",
        () => showDetail(request)
      );


      container.appendChild(
        item
      );

    }
  );

}



/* =====================================================
   DETAIL ANZEIGEN
   ===================================================== */

function showDetail(request) {

  currentRequest =
    request;


  document
    .getElementById("listView")
    .classList.add("hidden");


  document
    .getElementById("detailView")
    .classList.remove("hidden");


  document
    .getElementById("detailTitle")
    .textContent =
      request.service ||
      "Bauanfrage";


  document
    .getElementById("detailService")
    .textContent =
      request.service ||
      "-";


  document
    .getElementById("detailDate")
    .textContent =
      formatDate(
        request.created_at
      );


  document
    .getElementById("detailPlz")
    .textContent =
      request.plz ||
      "-";


  document
    .getElementById("detailArea")
    .textContent =
      request.area ||
      "-";


  document
    .getElementById("detailDescription")
    .textContent =
      request.description ||
      "-";


  document
    .getElementById("detailName")
    .textContent =
      request.name ||
      "-";


  document
    .getElementById("detailPhone")
    .textContent =
      request.phone ||
      "-";


  document
    .getElementById("detailEmail")
    .textContent =
      request.email ||
      "-";


  document
    .getElementById("statusSelect")
    .value =
      request.status ||
      "neu";


  document
    .getElementById("statusMessage")
    .textContent =
      "";

}



/* =====================================================
   ZURÜCK ZU ANFRAGEN
   ===================================================== */

function showList() {

  document
    .getElementById("detailView")
    .classList.add("hidden");


  document
    .getElementById("listView")
    .classList.remove("hidden");


  currentRequest =
    null;

}



/* =====================================================
   STATUS SPEICHERN
   ===================================================== */

async function saveStatus() {

  if (!currentRequest) {

    return;

  }


  const status =
    document
      .getElementById(
        "statusSelect"
      )
      .value;


  const message =
    document
      .getElementById(
        "statusMessage"
      );


  message.className =
    "";


  message.textContent =
    "Speichere...";


  const {
    error
  } =
    await supabaseClient
      .from("bauanfragen")
      .update({

        status:
          status

      })
      .eq(
        "id",
        currentRequest.id
      );


  if (error) {

    message.className =
      "error";


    message.textContent =
      "Fehler: " +
      error.message;


    return;

  }


  currentRequest.status =
    status;


  message.className =
    "success";


  message.textContent =
    "Status gespeichert.";


  loadRequests();

}



/* =====================================================
   FACHBETRIEBE LADEN
   ===================================================== */

async function loadFirms() {

  const loading =
    document
      .getElementById(
        "firmsLoading"
      );


  const container =
    document
      .getElementById(
        "firms"
      );


  loading.style.display =
    "block";


  container.innerHTML =
    "";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("fachbetriebe")
      .select("*")
      .order(
        "firma",
        {
          ascending: true
        }
      );


  loading.style.display =
    "none";


  if (error) {

    container.innerHTML =
      `
      <div class="error">

        Fehler beim Laden der Fachbetriebe:

        ${escapeHtml(
          error.message
        )}

      </div>
      `;

    return;

  }


  if (!data || data.length === 0) {

    container.innerHTML =
      `
      <div class="empty">

        Noch keine Fachbetriebe vorhanden.

        <br><br>

        Tippe oben auf
        „➕ Fachbetrieb“.

      </div>
      `;

    return;

  }


  data.forEach(
    firm => {

      renderFirm(
        firm,
        container
      );

    }
  );

}



/* =====================================================
   FACHBETRIEB DARSTELLEN
   ===================================================== */

function renderFirm(
  firm,
  container
) {

  const item =
    document.createElement(
      "div"
    );


  item.className =
    "firm";


  const firma =

      🏢
      ${escapeHtml(
        firma

    </div>


    <div class="firm-info">

      ${
        firm.inhaber
          ? "👤 " +
            escapeHtml(
              firm.inhaber

          : ""
      }


      ${
        firm.telefon
          ? "📞 " +
            escapeHtml(
              firm.telefon
            ) +
            "<br>"
          : ""
      }


      ${
        firm.email
          ? "📧 " +
            escapeHtml(
              firm.email
            ) +
            "<br>"
          : ""
      }


      ${
        firm.plz ||
        firm.ort

            escapeHtml(
              [
                firm.plz,
                firm.ort
              ]
              .filter(Boolean)
              .join(" ")
            ) +
            "<br>"
          : ""
      }


      ${
        firm.leistungen
          ? "🔧 " +
            escapeHtml(
              firm.leistungen
            ) +
            "<br>"
          : ""
      }


      📏 Radius:
      ${escapeHtml(
        String(
          firm.radius_km ??
          30
        )
      )}
      km

      <br>

      ${
        active
          ? "🟢 Aktiv"
          : "🔴 Inaktiv"
      }

    </div>


    <div class="firm-actions">

      <button
        onclick='openEditFirm(${JSON.stringify(
          firm
        ).replace(
          /'/g,
          "&#39;"
        )})'
      >
        ✏️ Bearbeiten
      </button>


      <button
        class="danger"
        onclick='deleteFirm("${escapeJs(
          firm.id
        )}")'
      >
        🗑️ Löschen
      </button>

    </div>

    `;


  container.appendChild(
    item
  );

}

/* =====================================================
   FACHBETRIEB SPEICHERN
   ===================================================== */

async function saveFirm() {

  clearFirmMessages();


  const firma =
    document
      .getElementById(
        "firmFirma"
      )
      .value
      .trim();


  const inhaber =
    document
      .getElementById(
        "firmInhaber"
      )
      .value
      .trim();


  const email =
    document
      .getElementById(
        "firmEmail"
      )
      .value
      .trim();


  const telefon =
    document
      .getElementById(
        "firmTelefon"
      )
      .value
      .trim();


  const plz =
    document
      .getElementById(
        "firmPlz"
      )
      .value
      .trim();


  const ort =
    document
      .getElementById(
        "firmOrt"
      )
      .value
      .trim();


  const leistungen =
    document
      .getElementById(
        "firmLeistungen"
      )
      .value
      .trim();


  const radiusValue =
    document
      .getElementById(
        "firmRadius"
      )
      .value;


  const radius =
    Number(
      radiusValue || 30
    );


  const aktiv =
    document
      .getElementById(
        "firmAktiv"
      )
      .checked;


  const errorBox =
    document
      .getElementById(
        "firmFormError"
      );


  const successBox =
    document
      .getElementById(
        "firmFormSuccess"
      );


  if (!firma) {

    errorBox.textContent =
      "Bitte einen Firmennamen eingeben.";

    return;

  }


  if (
    Number.isNaN(radius) ||
    radius < 0
  ) {

    errorBox.textContent =
      "Bitte einen gültigen Radius eingeben.";

    return;

  }


  const data = {

    firma:
      firma,

    inhaber:
      inhaber || null,

    email:
      email || null,

    telefon:
      telefon || null,

    plz:
      plz || null,

    ort:
      ort || null,

    leistungen:
      leistungen || null,

    radius_km:
      radius,

    aktiv:
      aktiv

  };


  let result;


  if (currentFirm) {

    result =
      await supabaseClient
        .from("fachbetriebe")
        .update(
          data
        )
        .eq(
          "id",
          currentFirm.id
        );

  }

  else {

    result =
      await supabaseClient
        .from("fachbetriebe")
        .insert([
          data
        ]);

  }


  if (result.error) {

    console.error(
      "Fachbetrieb speichern:",
      result.error
    );


    errorBox.textContent =
      "Fehler beim Speichern:\n\n" +
      result.error.message;


    return;

  }


  successBox.textContent =
    currentFirm
      ? "Fachbetrieb wurde geändert."
      : "Fachbetrieb wurde angelegt.";


  setTimeout(
    () => {

      showFirmsList();

      loadFirms();

    },
    700
  );

}



/* =====================================================
   FACHBETRIEB LÖSCHEN
   ===================================================== */

async function deleteFirm(
  id
) {

  if (!id) {

    return;

  }


  const confirmed =
    confirm(
      "Möchtest du diesen Fachbetrieb wirklich löschen?"
    );


  if (!confirmed) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("fachbetriebe")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    alert(
      "Fehler beim Löschen:\n\n" +
      error.message
    );

    return;

  }


  loadFirms();

}

/* =====================================================
   DATUM
   ===================================================== */

function formatDate(
  value
) {

  if (!value) {

    return "-";

  }


  const date =
    new Date(
      value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return value;

  }


  return date.toLocaleString(
    "de-DE",
    {
      day:
        "2-digit",

      month:
        "2-digit",

      year:
        "2-digit",

      hour:
        "2-digit",

      minute:
        "2-digit",

      second:
        "2-digit"
    }
  );

}



/* =====================================================
   HTML SICHERN
   ===================================================== */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =====================================================
   JAVASCRIPT STRING SICHERN
   ===================================================== */

function escapeJs(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /"/g,
      '\\"'
    );

}
