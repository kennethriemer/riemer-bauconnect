<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171717">
<title>Riemer BauConnect – Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#171717;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:950px;
  margin:auto;
  padding:24px 16px 60px;
}

h1{
  margin:0 0 6px;
  font-size:30px;
}

.yellow{
  color:#ffd400;
}

.small{
  color:#aaa;
  margin-bottom:22px;
}

.card{
  background:#222;
  border:1px solid #333;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
}

input,
button{
  width:100%;
  padding:14px;
  border-radius:12px;
  font-size:16px;
}

input{
  background:#111;
  color:#fff;
  border:1px solid #444;
  margin-bottom:12px;
}

button{
  border:0;
  background:#ffd400;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:#333;
  color:#fff;
}

button.logout{
  width:auto;
  float:right;
  margin-top:-55px;
}

.hidden{
  display:none;
}

.error{
  background:#4a2020;
  color:#ffb0b0;
  padding:14px;
  border-radius:12px;
  margin-top:12px;
}

.success{
  background:#173d25;
  color:#9ff0b5;
  padding:14px;
  border-radius:12px;
  margin-top:12px;
}

.request{
  background:#292929;
  border:1px solid #444;
  border-radius:14px;
  padding:16px;
  margin:10px 0;
  cursor:pointer;
}

.request:active{
  transform:scale(.99);
}

.request-top{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr;
  gap:12px;
}

.label{
  color:#ffd400;
  font-size:13px;
  margin-bottom:4px;
}

.value{
  font-size:17px;
  font-weight:bold;
}

.muted{
  color:#aaa;
  margin-top:4px;
}

.detail{
  background:#292929;
  border-radius:14px;
  padding:18px;
  margin-top:15px;
}

.detail-row{
  padding:13px 0;
  border-bottom:1px solid #444;
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-label{
  color:#ffd400;
  font-size:13px;
  margin-bottom:5px;
}

.detail-value{
  font-size:17px;
  word-break:break-word;
}

.actions{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.actions button{
  flex:1;
}

@media(max-width:650px){
  .request-top{
    grid-template-columns:1fr 1fr;
  }

  .actions{
    flex-direction:column;
  }

  button.logout{
    float:none;
    width:100%;
    margin:15px 0 0;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <h1>
    RIEMER <span class="yellow">BAUCONNECT</span>
  </h1>

  <div class="small">
    Verwaltungsbereich – Bauanfragen
  </div>

  <!-- LOGIN -->

  <section id="loginCard" class="card">

    <h2>Admin Login</h2>

    <input
      id="email"
      type="email"
      placeholder="E-Mail"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Passwort"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Einloggen
    </button>

    <div id="loginError" class="error hidden"></div>

  </section>


  <!-- ADMIN -->

  <section id="adminArea" class="hidden">

    <div class="actions">

      <button
        class="secondary"
        id="refreshButton"
      >
        Aktualisieren
      </button>

      <button
        class="secondary"
        id="logoutButton"
      >
        Abmelden
      </button>

    </div>


    <!-- LISTE -->

    <div id="listView" class="card">

      <h2>Bauanfragen</h2>

      <div id="loading">
        Lade Bauanfragen …
      </div>

      <div id="requestList"></div>

      <div id="listError" class="error hidden"></div>

    </div>


    <!-- DETAIL -->

    <div id="detailView" class="card hidden">

      <div class="actions">

        <button
          class="secondary"
          id="backButton"
        >
          ← Zurück
        </button>

      </div>

      <h2>Bauanfrage</h2>

      <div id="detailContent"></div>

    </div>

  </section>

</div>


<script>

const SUPABASE_URL =
  "https://ehzugjmltfcvllftpjpp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Ieo0pxh7y8L4nr2xMS7fQQ_mPonnlOm";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const loginCard =
  document.getElementById("loginCard");

const adminArea =
  document.getElementById("adminArea");

const loginButton =
  document.getElementById("loginButton");

const logoutButton =
  document.getElementById("logoutButton");

const refreshButton =
  document.getElementById("refreshButton");

const backButton =
  document.getElementById("backButton");

const listView =
  document.getElementById("listView");

const detailView =
  document.getElementById("detailView");

const requestList =
  document.getElementById("requestList");

const detailContent =
  document.getElementById("detailContent");

const loading =
  document.getElementById("loading");

const loginError =
  document.getElementById("loginError");

const listError =
  document.getElementById("listError");


function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatDate(value){

  if(!value){
    return "-";
  }

  const date = new Date(value);

  return date.toLocaleString(
    "de-DE",
    {
      dateStyle:"short",
      timeStyle:"short"
    }
  );
}


async function checkSession(){

  const {
    data
  } = await db.auth.getSession();

  if(data.session){

    loginCard.classList.add("hidden");

    adminArea.classList.remove("hidden");

    loadRequests();

  }else{

    loginCard.classList.remove("hidden");

    adminArea.classList.add("hidden");

  }
}


loginButton.addEventListener(
  "click",
  async () => {

    loginError.classList.add("hidden");

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if(!email || !password){

      loginError.textContent =
        "Bitte E-Mail und Passwort eingeben.";

      loginError.classList.remove("hidden");

      return;
    }

    loginButton.disabled = true;

    loginButton.textContent =
      "Einloggen …";

    const {
      error
    } =
      await db.auth.signInWithPassword({
        email,
        password
      });

    loginButton.disabled = false;

    loginButton.textContent =
      "Einloggen";

    if(error){

      loginError.textContent =
        "Login fehlgeschlagen: " +
        error.message;

      loginError.classList.remove("hidden");

      return;
    }

    checkSession();

  }
);


logoutButton.addEventListener(
  "click",
  async () => {

    await db.auth.signOut();

    detailView.classList.add("hidden");
    listView.classList.remove("hidden");

    checkSession();

  }
);


refreshButton.addEventListener(
  "click",
  () => {

    loadRequests();

  }
);


backButton.addEventListener(
  "click",
  () => {

    detailView.classList.add("hidden");

    listView.classList.remove("hidden");

  }
);


async function loadRequests(){

  loading.style.display =
    "block";

  requestList.innerHTML =
    "";

  listError.classList.add("hidden");

  const {
    data,
    error
  } =
    await db
      .from("bauanfragen")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  loading.style.display =
    "none";


  if(error){

    listError.textContent =
      "Fehler beim Laden: " +
      error.message;

    listError.classList.remove(
      "hidden"
    );

    return;
  }


  if(!data || data.length === 0){

    requestList.innerHTML =
      '<p class="muted">Noch keine Bauanfragen vorhanden.</p>';

    return;
  }


  data.forEach(
    request => {

      const item =
        document.createElement("div");

      item.className =
        "request";


      item.innerHTML = `

        <div class="request-top">

          <div>
            <div class="label">
              Datum
            </div>

            <div class="value">
              ${escapeHtml(
                formatDate(request.created_at)
              )}
            </div>
          </div>


          <div>
            <div class="label">
              Leistung
            </div>

            <div class="value">
              ${escapeHtml(request.service)}
            </div>

            <div class="muted">
              ${escapeHtml(request.description || "")}
            </div>
          </div>


          <div>
            <div class="label">
              PLZ
            </div>

            <div class="value">
              ${escapeHtml(request.plz)}
            </div>
          </div>

        </div>

      `;


      item.addEventListener(
        "click",
        () => {

          showDetail(request);

        }
      );


      requestList.appendChild(item);

    }
  );

}


function showDetail(request){

  listView.classList.add("hidden");

  detailView.classList.remove("hidden");


  detailContent.innerHTML = `

    <div class="detail">

      <div class="detail-row">
        <div class="detail-label">
          Leistung
        </div>

        <div class="detail-value">
          ${escapeHtml(request.service)}
        </div>
      </div>


      <div class="detail-row">
        <div class="detail-label">
          Datum
        </div>

        <div class="detail-value">
          ${escapeHtml(
            formatDate(request.created_at)
          )}
        </div>
      </div>


      <div class="detail-row">
        <div class="detail-label">
          PLZ
        </div>

        <div class="detail-value">
          ${escapeHtml(request.plz)}
        </div>
      </div>


      <div class="detail-row">
        <div class="detail-label">
          Bereich
        </div>

        <div class="detail-value">
          ${escapeHtml(request.area || "-")}
        </div>
      </div>


      <div class="detail-row">
        <div class="detail-label">
          Beschreibung
        </div>

        <div class="detail-value">
          ${escapeHtml(request.description || "-")}
        </div>
      </div>


      <div class="detail-row">
        <div class="detail-label">
          Kunde
        </div>

        <div class="detail-value">
          ${escapeHtml(request.name)}
        </div>
      </div>


      <div class="detail-row">
        <div class="detail-label">
          Telefon
        </div>

        <div class="detail-value">
          ${escapeHtml(request.phone)}
        </div>
      </div>


      <div class="detail-row">
        <div class="detail-label">
          E-Mail
        </div>

        <div class="detail-value">
          ${escapeHtml(request.email || "-")}
        </div>
      </div>


      <div class="detail-row">
        <div class="detail-label">
          Status
        </div>

        <div class="detail-value">
          ${escapeHtml(request.status)}
        </div>
      </div>

    </div>

  `;

}


checkSession();

</script>

</body>
</html>
