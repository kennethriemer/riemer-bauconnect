<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171717">

<title>Riemer BauConnect – Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #171717;
  color: #fff;
  font-family: Arial, sans-serif;
}

.wrap {
  max-width: 950px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin: 0 0 6px;
  font-size: 28px;
}

h2 {
  margin-top: 0;
}

.small {
  color: #aaa;
  margin-bottom: 20px;
}

.card {
  background: #222;
  border: 1px solid #444;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 15px;
}

input,
button,
select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #555;
  font-size: 16px;
}

input,
select {
  background: #111;
  color: #fff;
}

button {
  background: #ffd400;
  color: #111;
  border: 0;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

.login {
  max-width: 450px;
  margin: 70px auto;
  padding: 20px;
}

.login input {
  margin-bottom: 12px;
}

.hidden {
  display: none;
}

.error {
  color: #ff7070;
  margin-top: 12px;
}

.success {
  color: #66e08a;
  margin-top: 12px;
}

.request {
  cursor: pointer;
  transition: .15s;
}

.request:hover {
  border-color: #ffd400;
  transform: translateY(-1px);
}

.request-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 8px;
}

.request-info {
  color: #bbb;
  line-height: 1.6;
}

.status {
  display: inline-block;
  padding: 7px 12px;
  border-radius: 20px;
  margin-top: 10px;
  font-size: 14px;
  font-weight: bold;
}

.status-neu {
  background: #d8aa00;
  color: #111;
}

.status-kontakt {
  background: #2478d8;
}

.status-angebot {
  background: #e87818;
}

.status-auftrag {
  background: #239447;
}

.status-erledigt {
  background: #555;
}

.detail-row {
  border-bottom: 1px solid #444;
  padding: 12px 0;
}

.detail-label {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 4px;
}

.detail-value {
  white-space: pre-wrap;
  word-break: break-word;
}

.back {
  background: #333;
  color: #fff;
  margin-bottom: 15px;
}

.logout {
  background: #333;
  color: #fff;
  margin-top: 10px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.header button {
  width: auto;
  padding: 10px 16px;
}

.loading {
  color: #aaa;
  padding: 20px 0;
}

.empty {
  color: #aaa;
  text-align: center;
  padding: 30px;
}

/* FOTOS */

.photo-gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 12px;
}

.photo-card {
  background: #111;
  border: 1px solid #444;
  border-radius: 12px;
  padding: 8px;
}

.photo-card img {
  display: block;
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
}

.photo-card a {
  display: block;
  margin-top: 8px;
  background: #ffd400;
  color: #111;
  text-align: center;
  padding: 10px;
  border-radius: 8px;
  font-weight: bold;
  text-decoration: none;
}

.photo-loading {
  color: #aaa;
  padding: 12px 0;
}

.photo-empty {
  color: #aaa;
  padding: 12px 0;
}

@media (max-width: 600px) {

  .wrap {
    padding: 14px;
  }

  .photo-gallery {
    grid-template-columns: 1fr;
  }

  .photo-card img {
    height: 220px;
  }

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login">

  <div class="card">

    <h1>Riemer BauConnect</h1>

    <div class="small">
      Adminbereich
    </div>

    <input
      id="email"
      type="email"
      placeholder="E-Mail"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Passwort"
      autocomplete="current-password"
    >

    <button onclick="login()">
      Einloggen
    </button>

    <div id="loginError" class="error"></div>

  </div>

</div>


<!-- ADMIN -->

<div id="adminScreen" class="wrap hidden">

  <div class="header">

    <div>

      <h1>Riemer BauConnect</h1>

      <div class="small">
        Bauanfragen verwalten
      </div>

    </div>

    <button onclick="logout()">
      Abmelden
    </button>

  </div>


  <!-- LISTE -->

  <div id="listView">

    <div class="card">

      <h2>Bauanfragen</h2>

      <div id="loading" class="loading">
        Lade Bauanfragen...
      </div>

      <div id="requests"></div>

    </div>

  </div>


  <!-- DETAIL -->

  <div id="detailView" class="hidden">

    <button
      class="back"
      onclick="showList()"
    >
      ← Zurück zu den Bauanfragen
    </button>


    <div class="card">

      <h2 id="detailTitle">
        Bauanfrage
      </h2>


      <div class="detail-row">

        <div class="detail-label">
          Leistung
        </div>

        <div
          id="detailService"
          class="detail-value"
        ></div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          Datum
        </div>

        <div
          id="detailDate"
          class="detail-value"
        ></div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          PLZ
        </div>

        <div
          id="detailPlz"
          class="detail-value"
        ></div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          Ort / Bereich
        </div>

        <div
          id="detailArea"
          class="detail-value"
        ></div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          Beschreibung
        </div>

        <div
          id="detailDescription"
          class="detail-value"
        ></div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          Name
        </div>

        <div
          id="detailName"
          class="detail-value"
        ></div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          Telefon
        </div>

        <div
          id="detailPhone"
          class="detail-value"
        ></div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          E-Mail
        </div>

        <div
          id="detailEmail"
          class="detail-value"
        ></div>

      </div>


      <!-- FOTOS -->

      <div class="detail-row">

        <div class="detail-label">
          📸 Projektfotos
        </div>

        <div
          id="photoStatus"
          class="photo-loading"
        >
          Fotos werden geladen...
        </div>

        <div
          id="photoGallery"
          class="photo-gallery"
        ></div>

      </div>


      <!-- STATUS -->

      <div class="detail-row">

        <div class="detail-label">
          Status ändern
        </div>


        <select id="statusSelect">

          <option value="neu">
            🟡 Neu
          </option>

          <option value="kontakt">
            🔵 Kontakt aufgenommen
          </option>

          <option value="angebot">
            🟠 Angebot
          </option>

          <option value="auftrag">
            🟢 Auftrag
          </option>

          <option value="erledigt">
            ⚫ Erledigt
          </option>

        </select>


        <br><br>


        <button onclick="saveStatus()">
          Status speichern
        </button>


        <div id="statusMessage"></div>

      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://ehzugjmltfcvllftpjpp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Ieo0pxh7y8L4nr2xMS7fQQ_mPonnlOm";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentRequest = null;


/* LOGIN */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  const error =
    document
      .getElementById("loginError");


  error.textContent = "";


  if (!email || !password) {

    error.textContent =
      "Bitte E-Mail und Passwort eingeben.";

    return;
  }


  const {
    error: loginError
  } =
    await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });


  if (loginError) {

    error.textContent =
      loginError.message;

    return;
  }


  showAdmin();

}


/* LOGOUT */

async function logout() {

  await supabaseClient.auth.signOut();


  document
    .getElementById("adminScreen")
    .classList.add("hidden");


  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

}


/* ADMIN ANZEIGEN */

function showAdmin() {

  document
    .getElementById("loginScreen")
    .classList.add("hidden");


  document
    .getElementById("adminScreen")
    .classList.remove("hidden");


  loadRequests();

}


/* BAUANFRAGEN LADEN */

async function loadRequests() {

  const loading =
    document
      .getElementById("loading");


  const container =
    document
      .getElementById("requests");


  loading.style.display =
    "block";


  container.innerHTML = "";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("bauanfragen")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  loading.style.display =
    "none";


  if (error) {

    container.innerHTML =
      `<div class="error">
        Fehler beim Laden:
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      `<div class="empty">
        Keine Bauanfragen vorhanden.
      </div>`;

    return;
  }


  data.forEach(request => {

    const item =
      document.createElement("div");


    item.className =
      "card request";


    const status =
      request.status || "neu";


    item.innerHTML = `

      <div class="request-title">
        ${escapeHtml(
          request.service || "Bauanfrage"
        )}
      </div>


      <div class="request-info">

        PLZ:
        ${escapeHtml(
          request.plz || "-"
        )}

        <br>

        ${escapeHtml(
          request.name || "-"
        )}

        <br>

        ${formatDate(
          request.created_at
        )}

      </div>


      <span
        class="status ${getStatusClass(status)}"
      >
        ${getStatusText(status)}
      </span>

    `;


    item.addEventListener(
      "click",
      () => showDetail(request)
    );


    container.appendChild(item);

  });

}


/* DETAIL ANZEIGEN */

function showDetail(request) {

  currentRequest =
    request;


  document
    .getElementById("listView")
    .classList.add("hidden");


  document
    .getElementById("detailView")
    .classList.remove("hidden");


  document
    .getElementById("detailTitle")
    .textContent =
      request.service ||
      "Bauanfrage";


  document
    .getElementById("detailService")
    .textContent =
      request.service ||
      "-";


  document
    .getElementById("detailDate")
    .textContent =
      formatDate(
        request.created_at
      );


  document
    .getElementById("detailPlz")
    .textContent =
      request.plz ||
      "-";


  document
    .getElementById("detailArea")
    .textContent =
      request.area ||
      "-";


  document
    .getElementById("detailDescription")
    .textContent =
      request.description ||
      "-";


  document
    .getElementById("detailName")
    .textContent =
      request.name ||
      "-";


  document
    .getElementById("detailPhone")
    .textContent =
      request.phone ||
      "-";


  document
    .getElementById("detailEmail")
    .textContent =
      request.email ||
      "-";


  document
    .getElementById("statusSelect")
    .value =
      request.status ||
      "neu";


  document
    .getElementById("statusMessage")
    .textContent =
      "";


  loadPhotos(request.id);

}


/* FOTOS LADEN */

async function loadPhotos(requestId) {

  const gallery =
    document
      .getElementById("photoGallery");


  const status =
    document
      .getElementById("photoStatus");


  gallery.innerHTML = "";


  status.textContent =
    "Fotos werden geladen...";


  if (!requestId) {

    status.textContent =
      "Keine Anfrage-ID vorhanden.";

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient.storage
      .from("Projektfotos")
      .list(
        requestId,
        {
          limit: 100,
          sortBy: {
            column: "created_at",
            order: "asc"
          }
        }
      );


  if (error) {

    console.error(
      "Foto-Fehler:",
      error
    );


    status.textContent =
      "Fotos konnten nicht geladen werden: " +
      error.message;

    return;
  }


  if (!data || data.length === 0) {

    status.textContent =
      "Keine Fotos zu dieser Bauanfrage.";

    return;
  }


  let photoCount = 0;


  for (const file of data) {

    /*
      Supabase kann in einem Ordner
      auch Unterordner anzeigen.
      Wir zeigen hier nur echte Dateien.
    */

    if (!file.name) {
      continue;
    }


    const filePath =
      requestId +
      "/" +
      file.name;


    const {
      data: signedData,
      error: signedError
    } =
      await supabaseClient.storage
        .from("Projektfotos")
        .createSignedUrl(
          filePath,
          3600
        );


    if (signedError) {

      console.error(
        "Signed-URL-Fehler:",
        signedError
      );

      continue;
    }


    if (!signedData ||
        !signedData.signedUrl) {

      continue;
    }


    const photo =
      document.createElement("div");


    photo.className =
      "photo-card";


    const image =
      document.createElement("img");


    image.src =
      signedData.signedUrl;


    image.alt =
      "Projektfoto";


    image.loading =
      "lazy";


    const link =
      document.createElement("a");


    link.href =
      signedData.signedUrl;


    link.target =
      "_blank";


    link.rel =
      "noopener";


    link.textContent =
      "Foto öffnen";


    photo.appendChild(
      image
    );


    photo.appendChild(
      link
    );


    gallery.appendChild(
      photo
    );


    photoCount++;

  }


  if (photoCount === 0) {

    status.textContent =
      "Keine Fotos konnten angezeigt werden.";

    return;
  }


  status.textContent =
    photoCount === 1
      ? "1 Foto"
      : photoCount + " Fotos";

}


/* ZURÜCK */

function showList() {

  document
    .getElementById("detailView")
    .classList.add("hidden");


  document
    .getElementById("listView")
    .classList.remove("hidden");


  currentRequest =
    null;

}


/* STATUS SPEICHERN */

async function saveStatus() {

  if (!currentRequest) {
    return;
  }


  const status =
    document
      .getElementById("statusSelect")
      .value;


  const message =
    document
      .getElementById("statusMessage");


  message.className = "";


  message.textContent =
    "Speichere...";


  const {
    error
  } =
    await supabaseClient
      .from("bauanfragen")
      .update({
        status: status
      })
      .eq(
        "id",
        currentRequest.id
      );


  if (error) {

    message.className =
      "error";


    message.textContent =
      "Fehler: " +
      error.message;


    return;
  }


  currentRequest.status =
    status;


  message.className =
    "success";


  message.textContent =
    "Status erfolgreich gespeichert.";

}


/* STATUS-TEXT */

function getStatusText(status) {

  switch (status) {

    case "kontakt":
      return "🔵 Kontakt aufgenommen";

    case "angebot":
      return "🟠 Angebot";

    case "auftrag":
      return "🟢 Auftrag";

    case "erledigt":
      return "⚫ Erledigt";

    default:
      return "🟡 Neu";

  }

}


/* STATUS-KLASSE */

function getStatusClass(status) {

  switch (status) {

    case "kontakt":
      return "status-kontakt";

    case "angebot":
      return "status-angebot";

    case "auftrag":
      return "status-auftrag";

    case "erledigt":
      return "status-erledigt";

    default:
      return "status-neu";

  }

}


/* DATUM */

function formatDate(value) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(value);


  return date.toLocaleString(
    "de-DE",
    {
      dateStyle: "short",
      timeStyle: "medium"
    }
  );

}


/* SICHERHEIT */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* SESSION PRÜFEN */

async function checkSession() {

  const {
    data
  } =
    await supabaseClient
      .auth
      .getSession();


  if (data.session) {

    showAdmin();

  }

}


checkSession();

</script>

</body>
</html>
