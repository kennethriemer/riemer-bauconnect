<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Riemer BauConnect – Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      background: #181818;
      padding: 18px;
      border-bottom: 2px solid #f5c400;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 5px 0 0;
      color: #aaa;
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      border: 1px solid #333;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    h3 {
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      margin-bottom: 14px;
      background: #101010;
      border: 1px solid #444;
      border-radius: 9px;
      color: #fff;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    label {
      font-size: 13px;
      color: #bbb;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .yellow {
      background: #f5c400;
      color: #111;
    }

    .dark {
      background: #333;
      color: #fff;
    }

    .red {
      background: #c62828;
      color: #fff;
    }

    .green {
      background: #2e7d32;
      color: #fff;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tabs button {
      flex: 1;
    }

    .tab-active {
      background: #f5c400;
      color: #111;
    }

    .hidden {
      display: none !important;
    }

    .request,
    .firm {
      background: #151515;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .request:hover,
    .firm:hover {
      border-color: #f5c400;
    }

    .request-title,
    .firm-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .small {
      font-size: 13px;
      color: #aaa;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #333;
      font-size: 12px;
      margin-top: 7px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
      min-width: 100px;
    }

    .detail {
      line-height: 1.6;
    }

    .detail strong {
      color: #f5c400;
    }

    .status-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .status-row select {
      margin: 0;
      flex: 1;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .message {
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 15px;
      background: #222;
      border: 1px solid #444;
    }

    .success {
      border-color: #2e7d32;
    }

    .error {
      border-color: #c62828;
    }

    @media (max-width: 600px) {
      main {
        padding: 12px;
      }

      .status-row {
        flex-direction: column;
        align-items: stretch;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏗️ Riemer BauConnect</h1>
  <p>Adminbereich</p>
</header>

<main>

  <!-- LOGIN -->
  <section id="loginCard" class="card">
    <h2>🔐 Admin Login</h2>

    <label>E-Mail</label>
    <input id="loginEmail" type="email" placeholder="E-Mail">

    <label>Passwort</label>
    <input id="loginPassword" type="password" placeholder="Passwort">

    <button id="loginButton" class="yellow">
      Einloggen
    </button>

    <div id="loginMessage"></div>
  </section>


  <!-- ADMIN -->
  <section id="adminArea" class="hidden">

    <div class="topbar">
      <div>
        <h2 style="margin:0;">Admin Dashboard</h2>
      </div>

      <button id="logoutButton" class="dark">
        Abmelden
      </button>
    </div>


    <!-- TABS -->
    <div class="tabs">
      <button id="requestsTab" class="tab-active">
        🏗️ Bauanfragen
      </button>

      <button id="firmsTab" class="dark">
        🏢 Fachbetriebe
      </button>
    </div>


    <!-- ========================= -->
    <!-- BAUANFRAGEN -->
    <!-- ========================= -->

    <section id="requestsArea">

      <div class="card">
        <h2>Neue Bauanfragen</h2>
        <div id="requestsList">
          Lade Bauanfragen...
        </div>
      </div>

      <div id="requestDetail" class="card hidden">
        <h2>📄 Anfrage</h2>

        <div id="requestInfo" class="detail"></div>

        <br>

        <div class="status-row">
          <select id="statusSelect">
            <option value="neu">Neu</option>
            <option value="kontakt">Kontakt aufgenommen</option>
            <option value="angebot">Angebot</option>
            <option value="auftrag">Auftrag</option>
            <option value="erledigt">Erledigt</option>
          </select>

          <button id="saveStatusButton" class="yellow">
            Status speichern
          </button>
        </div>

        <br>

        <h3>🏢 Passende Fachbetriebe</h3>

        <div id="matchesList">
          Noch keine Suche.
        </div>
      </div>

    </section>


    <!-- ========================= -->
    <!-- FACHBETRIEBE -->
    <!-- ========================= -->

    <section id="firmsArea" class="hidden">

      <div class="card">

        <div class="topbar">
          <h2 style="margin:0;">🏢 Fachbetriebe</h2>

          <button id="newFirmButton" class="yellow">
            + Fachbetrieb
          </button>
        </div>

        <div id="firmList">
          Lade Fachbetriebe...
        </div>

      </div>


      <!-- FACHBETRIEB FORMULAR -->

      <div id="firmForm" class="card hidden">

        <h2 id="firmFormTitle">
          Fachbetrieb hinzufügen
        </h2>

        <input id="firmId" type="hidden">

        <label>Firmenname *</label>
        <input id="firmFirma" type="text" placeholder="z. B. Riemer Straßenbau GmbH">

        <label>Ansprechpartner</label>
        <input id="firmInhaber" type="text" placeholder="z. B. Max Mustermann">

        <label>E-Mail</label>
        <input id="firmEmail" type="email" placeholder="firma@example.de">

        <label>Telefon</label>
        <input id="firmTelefon" type="text" placeholder="0170 1234567">

        <label>PLZ *</label>
        <input id="firmPlz" type="text" placeholder="24955">

        <label>Ort</label>
        <input id="firmOrt" type="text" placeholder="Harrislee">

        <label>Leistungen</label>
        <textarea
          id="firmLeistungen"
          placeholder="Straßenbau, Asphaltarbeiten, Pflasterarbeiten"
        ></textarea>

        <label>Radius in km</label>
        <input
          id="firmRadius"
          type="number"
          value="30"
          min="1"
          max="500"
        >

        <div class="actions">

          <button id="saveFirmButton" class="yellow">
            Fachbetrieb speichern
          </button>

          <button id="cancelFirmButton" class="dark">
            Abbrechen
          </button>

        </div>

        <div id="firmMessage"></div>

      </div>

    </section>

  </section>

</main>


<script type="module">

  /* =========================================
     SUPABASE
  ========================================= */

  import {
    createClient
  } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


  const SUPABASE_URL =
    "https://ehzugjmltfcvllftpjpp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Ieo0pxh7y8L4nr2xMS7fQQ_mPonnlOm";


  const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  /* =========================================
     ELEMENTE
  ========================================= */

  const loginCard =
    document.getElementById("loginCard");

  const adminArea =
    document.getElementById("adminArea");

  const loginButton =
    document.getElementById("loginButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const loginEmail =
    document.getElementById("loginEmail");

  const loginPassword =
    document.getElementById("loginPassword");

  const loginMessage =
    document.getElementById("loginMessage");

  const requestsTab =
    document.getElementById("requestsTab");

  const firmsTab =
    document.getElementById("firmsTab");

  const requestsArea =
    document.getElementById("requestsArea");

  const firmsArea =
    document.getElementById("firmsArea");

  const requestsList =
    document.getElementById("requestsList");

  const requestDetail =
    document.getElementById("requestDetail");

  const requestInfo =
    document.getElementById("requestInfo");

  const statusSelect =
    document.getElementById("statusSelect");

  const saveStatusButton =
    document.getElementById("saveStatusButton");

  const matchesList =
    document.getElementById("matchesList");

  const newFirmButton =
    document.getElementById("newFirmButton");

  const firmForm =
    document.getElementById("firmForm");

  const firmFormTitle =
    document.getElementById("firmFormTitle");

  const firmId =
    document.getElementById("firmId");

  const firmFirma =
    document.getElementById("firmFirma");

  const firmInhaber =
    document.getElementById("firmInhaber");

  const firmEmail =
    document.getElementById("firmEmail");

  const firmTelefon =
    document.getElementById("firmTelefon");

  const firmPlz =
    document.getElementById("firmPlz");

  const firmOrt =
    document.getElementById("firmOrt");

  const firmLeistungen =
    document.getElementById("firmLeistungen");

  const firmRadius =
    document.getElementById("firmRadius");

  const saveFirmButton =
    document.getElementById("saveFirmButton");

  const cancelFirmButton =
    document.getElementById("cancelFirmButton");

  const firmMessage =
    document.getElementById("firmMessage");



  /* =========================================
     VARIABLEN
  ========================================= */

  let currentRequest = null;



  /* =========================================
     LOGIN
  ========================================= */

  loginButton.addEventListener("click", async () => {

    loginMessage.innerHTML = "";

    const email =
      loginEmail.value.trim();

    const password =
      loginPassword.value;

    if (!email || !password) {

      loginMessage.innerHTML =
        `<div class="message error">
          Bitte E-Mail und Passwort eingeben.
        </div>`;

      return;
    }


    loginButton.disabled = true;
    loginButton.textContent = "Einloggen...";


    const { data, error } =
      await db.auth.signInWithPassword({
        email,
        password
      });


    loginButton.disabled = false;
    loginButton.textContent = "Einloggen";


    if (error) {

      loginMessage.innerHTML =
        `<div class="message error">
          Login fehlgeschlagen: ${escapeHtml(error.message)}
        </div>`;

      return;
    }


    loginCard.classList.add("hidden");
    adminArea.classList.remove("hidden");

    loadRequests();
    loadFirms();

  });



  /* =========================================
     LOGOUT
  ========================================= */

  logoutButton.addEventListener("click", async () => {

    await db.auth.signOut();

    adminArea.classList.add("hidden");
    loginCard.classList.remove("hidden");

    requestDetail.classList.add("hidden");

  });



  /* =========================================
     SESSION PRÜFEN
  ========================================= */

  const {
    data: sessionData
  } = await db.auth.getSession();


  if (sessionData.session) {

    loginCard.classList.add("hidden");
    adminArea.classList.remove("hidden");

    loadRequests();
    loadFirms();

  }



  /* =========================================
     TABS
  ========================================= */

  requestsTab.addEventListener("click", () => {

    requestsArea.classList.remove("hidden");
    firmsArea.classList.add("hidden");

    requestsTab.classList.add("tab-active");
    requestsTab.classList.remove("dark");

    firmsTab.classList.remove("tab-active");
    firmsTab.classList.add("dark");

  });


  firmsTab.addEventListener("click", () => {

    requestsArea.classList.add("hidden");
    firmsArea.classList.remove("hidden");

    firmsTab.classList.add("tab-active");
    firmsTab.classList.remove("dark");

    requestsTab.classList.remove("tab-active");
    requestsTab.classList.add("dark");

    loadFirms();

  });



  /* =========================================
     BAUANFRAGEN LADEN
  ========================================= */

  async function loadRequests() {

    requestsList.innerHTML =
      "Lade Bauanfragen...";


    const {
      data,
      error
    } = await db
      .from("bauanfragen")
      .select("*")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      requestsList.innerHTML =
        `<div class="message error">
          Fehler: ${escapeHtml(error.message)}
        </div>`;

      return;
    }


    if (!data || data.length === 0) {

      requestsList.innerHTML =
        `<div class="message">
          Keine Bauanfragen vorhanden.
        </div>`;

      return;
    }


    requestsList.innerHTML = "";


    data.forEach(request => {

      const div =
        document.createElement("div");

      div.className = "request";

      div.innerHTML = `

        <div class="request-title">
          ${escapeHtml(request.service || "Bauanfrage")}
        </div>

        <div class="small">
          📍 ${escapeHtml(request.plz || "")}
          ${request.area ? " – " + escapeHtml(request.area) : ""}
        </div>

        <div class="small">
          👤 ${escapeHtml(request.name || "")}
        </div>

        <div class="small">
          📞 ${escapeHtml(request.phone || "")}
        </div>

        <div>
          <span class="badge">
            ${escapeHtml(request.status || "neu")}
          </span>
        </div>

      `;


      div.addEventListener("click", () => {

        openRequest(request);

      });


      requestsList.appendChild(div);

    });

  }



  /* =========================================
     ANFRAGE ÖFFNEN
  ========================================= */

  function openRequest(request) {

    currentRequest = request;

    requestDetail.classList.remove("hidden");


    requestInfo.innerHTML = `

      <div>
        <strong>Leistung:</strong><br>
        ${escapeHtml(request.service || "")}
      </div>

      <div>
        <strong>PLZ:</strong><br>
        ${escapeHtml(request.plz || "")}
      </div>

      <div>
        <strong>Ort:</strong><br>
        ${escapeHtml(request.area || "")}
      </div>

      <div>
        <strong>Beschreibung:</strong><br>
        ${escapeHtml(request.description || "")}
      </div>

      <div>
        <strong>Name:</strong><br>
        ${escapeHtml(request.name || "")}
      </div>

      <div>
        <strong>Telefon:</strong><br>
        ${escapeHtml(request.phone || "")}
      </div>

      <div>
        <strong>E-Mail:</strong><br>
        ${escapeHtml(request.email || "")}
      </div>

      <div>
        <strong>Erstellt:</strong><br>
        ${formatDate(request.created_at)}
      </div>

    `;


    statusSelect.value =
      request.status || "neu";


    loadMatches(request);

    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: "smooth"
    });

  }



  /* =========================================
     STATUS SPEICHERN
  ========================================= */

  saveStatusButton.addEventListener("click", async () => {

    if (!currentRequest) return;


    saveStatusButton.disabled = true;
    saveStatusButton.textContent =
      "Speichere...";


    const newStatus =
      statusSelect.value;


    const {
      error
    } = await db
      .from("bauanfragen")
      .update({
        status: newStatus
      })
      .eq("id", currentRequest.id);


    saveStatusButton.disabled = false;
    saveStatusButton.textContent =
      "Status speichern";


    if (error) {

      alert(
        "Fehler beim Speichern: " +
        error.message
      );

      return;
    }


    currentRequest.status =
      newStatus;


    alert("Status gespeichert.");

    loadRequests();

  });



  /* =========================================
     FACHBETRIEBE LADEN
  ========================================= */

  async function loadFirms() {

    const firmList =
      document.getElementById("firmList");


    firmList.innerHTML =
      "Lade Fachbetriebe...";


    const {
      data,
      error
    } = await db
      .from("fachbetriebe")
      .select("*")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      firmList.innerHTML =
        `<div class="message error">
          Fehler: ${escapeHtml(error.message)}
        </div>`;

      return;
    }


    if (!data || data.length === 0) {

      firmList.innerHTML =
        `<div class="message">
          Noch keine Fachbetriebe vorhanden.
        </div>`;

      return;
    }


    firmList.innerHTML = "";


    data.forEach(firm => {

      const div =
        document.createElement("div");

      div.className = "firm";


      div.innerHTML = `

        <div class="firm-title">
          🏢 ${escapeHtml(firm.firma || "")}
        </div>

        <div class="small">
          👤 ${escapeHtml(firm.inhaber || "-")}
        </div>

        <div class="small">
          📍 ${escapeHtml(firm.plz || "")}
          ${firm.ort ? " – " + escapeHtml(firm.ort) : ""}
        </div>

        <div class="small">
          📞 ${escapeHtml(firm.telefon || "-")}
        </div>

        <div class="small">
          ✉️ ${escapeHtml(firm.email || "-")}
        </div>

        <div class="small">
          🛠️ ${escapeHtml(firm.leistungen || "-")}
        </div>

        <div class="small">
          📏 Radius: ${escapeHtml(String(firm.radius_km || 0))} km
        </div>

        <div class="actions">

          <button
            class="yellow edit-firm-button"
            data-id="${firm.id}">
            ✏️ Bearbeiten
          </button>

          <button
            class="red delete-firm-button"
            data-id="${firm.id}">
            🗑️ Löschen
          </button>

        </div>

      `;


      firmList.appendChild(div);

    });


    /* Bearbeiten */

    document
      .querySelectorAll(".edit-firm-button")
      .forEach(button => {

        button.addEventListener("click", () => {

          const id =
            button.dataset.id;

          const firm =
            data.find(item =>
              item.id === id
            );

          if (firm) {

            editFirm(firm);

          }

        });

      });


    /* Löschen */

    document
      .querySelectorAll(".delete-firm-button")
      .forEach(button => {

        button.addEventListener("click", () => {

          const id =
            button.dataset.id;

          deleteFirm(id);

        });

      });

  }



  /* =========================================
     NEUEN FACHBETRIEB ANLEGEN
  ========================================= */

  newFirmButton.addEventListener("click", () => {

    resetFirmForm();

    firmFormTitle.textContent =
      "Fachbetrieb hinzufügen";

    saveFirmButton.textContent =
      "Fachbetrieb speichern";

    firmForm.classList.remove("hidden");

    firmFirma.focus();

  });



  /* =========================================
     FACHBETRIEB BEARBEITEN
  ========================================= */

  function editFirm(firm) {

    firmId.value =
      firm.id || "";

    firmFirma.value =
      firm.firma || "";

    firmInhaber.value =
      firm.inhaber || "";

    firmEmail.value =
      firm.email || "";

    firmTelefon.value =
      firm.telefon || "";

    firmPlz.value =
      firm.plz || "";

    firmOrt.value =
      firm.ort || "";

    firmLeistungen.value =
      firm.leistungen || "";

    firmRadius.value =
      firm.radius_km || 30;


    firmFormTitle.textContent =
      "Fachbetrieb bearbeiten";

    saveFirmButton.textContent =
      "Änderungen speichern";

    firmMessage.innerHTML = "";

    firmForm.classList.remove("hidden");

    firmForm.scrollIntoView({
      behavior: "smooth"
    });

  }



  /* =========================================
     FACHBETRIEB SPEICHERN / AKTUALISIEREN
  ========================================= */

  saveFirmButton.addEventListener("click", async () => {

    firmMessage.innerHTML = "";


    const id =
      firmId.value.trim();

    const firma =
      firmFirma.value.trim();

    const inhaber =
      firmInhaber.value.trim();

    const email =
      firmEmail.value.trim();

    const telefon =
      firmTelefon.value.trim();

    const plz =
      firmPlz.value.trim();

    const ort =
      firmOrt.value.trim();

    const leistungen =
      firmLeistungen.value.trim();

    const radius =
      Number(firmRadius.value) || 30;


    if (!firma) {

      firmMessage.innerHTML =
        `<div class="message error">
          Bitte einen Firmennamen eingeben.
        </div>`;

      return;
    }


    if (!plz) {

      firmMessage.innerHTML =
        `<div class="message error">
          Bitte eine PLZ eingeben.
        </div>`;

      return;
    }


    saveFirmButton.disabled = true;
    saveFirmButton.textContent =
      "Speichere...";


    let result;


    /* =====================================
       BEARBEITEN
    ===================================== */

    if (id) {

      result =
        await db
          .from("fachbetriebe")
          .update({
            firma,
            inhaber,
            email,
            telefon,
            plz,
            ort,
            leistungen,
            radius_km: radius
          })
          .eq("id", id);

    }


    /* =====================================
       NEU ANLEGEN
    ===================================== */

    else {

      result =
        await db
          .from("fachbetriebe")
          .insert({
            firma,
            inhaber,
            email,
            telefon,
            plz,
            ort,
            leistungen,
            radius_km: radius
          });

    }


    saveFirmButton.disabled = false;


    if (result.error) {

      firmMessage.innerHTML =
        `<div class="message error">
          Fehler: ${escapeHtml(result.error.message)}
        </div>`;

      saveFirmButton.textContent =
        id
          ? "Änderungen speichern"
          : "Fachbetrieb speichern";

      return;
    }


    firmMessage.innerHTML =
      `<div class="message success">
        ✅ Fachbetrieb erfolgreich gespeichert.
      </div>`;


    saveFirmButton.textContent =
      "Gespeichert";


    setTimeout(() => {

      resetFirmForm();

      firmForm.classList.add("hidden");

      loadFirms();

    }, 700);

  });



  /* =========================================
     FACHBETRIEB LÖSCHEN
  ========================================= */

  async function deleteFirm(id) {

    const confirmed =
      confirm(
        "Möchtest du diesen Fachbetrieb wirklich löschen?"
      );


    if (!confirmed) return;


    const {
      error
    } = await db
      .from("fachbetriebe")
      .delete()
      .eq("id", id);


    if (error) {

      alert(
        "Fehler beim Löschen: " +
        error.message
      );

      return;
    }


    alert(
      "Fachbetrieb wurde gelöscht."
    );


    loadFirms();

  }



  /* =========================================
     FORMULAR ABBRECHEN
  ========================================= */

  cancelFirmButton.addEventListener("click", () => {

    resetFirmForm();

    firmForm.classList.add("hidden");

  });



  /* =========================================
     FORMULAR ZURÜCKSETZEN
  ========================================= */

  function resetFirmForm() {

    firmId.value = "";

    firmFirma.value = "";

    firmInhaber.value = "";

    firmEmail.value = "";

    firmTelefon.value = "";

    firmPlz.value = "";

    firmOrt.value = "";

    firmLeistungen.value = "";

    firmRadius.value = "30";

    firmFormTitle.textContent =
      "Fachbetrieb hinzufügen";

    saveFirmButton.textContent =
      "Fachbetrieb speichern";

    firmMessage.innerHTML = "";

  }



  /* =========================================
     PASSENDE FACHBETRIEBE
  ========================================= */

  async function loadMatches(request) {

    matchesList.innerHTML =
      "Suche passende Fachbetriebe...";


    const {
      data,
      error
    } = await db
      .from("fachbetriebe")
      .select("*")
      .eq("aktiv", true);


    /*
      Falls die Spalte "aktiv" in deiner
      Tabelle nicht vorhanden ist, wird
      unten automatisch noch einmal ohne
      den Filter gesucht.
    */

    let firms = data;


    if (error) {

      const fallback =
        await db
          .from("fachbetriebe")
          .select("*");


      if (fallback.error) {

        matchesList.innerHTML =
          `<div class="message error">
            Fehler bei der Suche:
            ${escapeHtml(fallback.error.message)}
          </div>`;

        return;
      }


      firms = fallback.data;

    }


    if (!firms || firms.length === 0) {

      matchesList.innerHTML =
        `<div class="message">
          Keine Fachbetriebe vorhanden.
        </div>`;

      return;
    }


    const requestPlz =
      String(request.plz || "")
        .trim();


    const requestService =
      String(request.service || "")
        .toLowerCase();


    const requestPrefix =
      requestPlz.substring(0, 2);


    const matches =
      firms.filter(firm => {

        const firmPlz =
          String(firm.plz || "")
            .trim();

        const firmPrefix =
          firmPlz.substring(0, 2);


        const sameRegion =
          requestPrefix &&
          firmPrefix &&
          requestPrefix === firmPrefix;


        const services =
          String(firm.leistungen || "")
            .toLowerCase();


        const serviceWords =
          requestService
            .split(/\s+/)
            .filter(word =>
              word.length > 3
            );


        const serviceMatch =
          serviceWords.length === 0
            ? true
            : serviceWords.some(word =>
                services.includes(word)
              );


        return sameRegion && serviceMatch;

      });


    if (matches.length === 0) {

      matchesList.innerHTML =
        `<div class="message">
          Keine passenden Fachbetriebe gefunden.
        </div>`;

      return;
    }


    matchesList.innerHTML = "";


    matches.forEach(firm => {

      const div =
        document.createElement("div");

      div.className = "firm";


      div.innerHTML = `

        <div class="firm-title">
          🏢 ${escapeHtml(firm.firma || "")}
        </div>

        <div class="small">
          📍 ${escapeHtml(firm.plz || "")}
          ${firm.ort ? " – " + escapeHtml(firm.ort) : ""}
        </div>

        <div class="small">
          👤 ${escapeHtml(firm.inhaber || "-")}
        </div>

        <div class="small">
          📞 ${escapeHtml(firm.telefon || "-")}
        </div>

        <div class="small">
          ✉️ ${escapeHtml(firm.email || "-")}
        </div>

        <div class="small">
          🛠️ ${escapeHtml(firm.leistungen || "-")}
        </div>

      `;


      matchesList.appendChild(div);

    });

  }



  /* =========================================
     HILFSFUNKTIONEN
  ========================================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function formatDate(date) {

    if (!date) return "-";


    try {

      return new Date(date)
        .toLocaleString("de-DE");

    } catch {

      return date;

    }

  }

</script>
