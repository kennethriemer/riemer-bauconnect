<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riemer BauConnect – Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#171717;
  color:#fff;
  font-family:Arial,sans-serif;
}
.wrap{
  max-width:1000px;
  margin:auto;
  padding:25px 18px;
}
h1{margin:0;font-size:32px}
.yellow{color:#ffd400}
.sub{
  color:#aaa;
  margin:10px 0 25px;
}
.card{
  background:#222;
  border:1px solid #383838;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}
input,button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #444;
  font-size:16px;
}
input{
  background:#111;
  color:#fff;
}
button{
  background:#ffd400;
  color:#111;
  border:0;
  font-weight:bold;
}
.logout{
  background:#333;
  color:#fff;
}
.error{
  background:#702020;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}
.success{
  background:#185c32;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  text-align:left;
  padding:12px 8px;
  border-bottom:1px solid #444;
}
th{color:#ffd400}
.small{color:#aaa;font-size:14px}
.hidden{display:none}
</style>
</head>

<body>

<div class="wrap">

  <h1>RIEMER <span class="yellow">BAUCONNECT</span></h1>
  <div class="sub">Verwaltungsbereich – Bauanfragen</div>

  <!-- LOGIN -->
  <div id="loginCard" class="card">
    <h2>Admin-Login</h2>

    <input id="email"
           type="email"
           placeholder="E-Mail">

    <input id="password"
           type="password"
           placeholder="Passwort">

    <button id="loginBtn">Anmelden</button>

    <div id="loginError" class="error hidden"></div>
  </div>

  <!-- ADMIN -->
  <div id="adminArea" class="hidden">

    <div class="card">
      <button id="logoutBtn" class="logout">Abmelden</button>
    </div>

    <div class="card">

      <h2>Bauanfragen</h2>

      <button id="refreshBtn">
        Aktualisieren
      </button>

      <div id="message"></div>

      <div style="overflow-x:auto">

        <table>
          <thead>
            <tr>
              <th>Datum</th>
              <th>Leistung</th>
              <th>PLZ</th>
              <th>Ort</th>
              <th>Name</th>
              <th>Telefon</th>
              <th>E-Mail</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="requestsBody"></tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://ehzugjmltfcvllftpjpp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ieo0pxh7y8L4nr2xMS7fQQ_mPonnlOm";

const client =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginCard =
document.getElementById("loginCard");

const adminArea =
document.getElementById("adminArea");

const loginError =
document.getElementById("loginError");

const message =
document.getElementById("message");

const body =
document.getElementById("requestsBody");


async function login(){

  loginError.classList.add("hidden");

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const {error} =
    await client.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    loginError.textContent =
      "Anmeldung fehlgeschlagen: " +
      error.message;

    loginError.classList.remove("hidden");

    return;
  }

  updateUI();

  loadRequests();
}


async function logout(){

  await client.auth.signOut();

  updateUI();
}


async function loadRequests(){

  message.innerHTML = "";

  body.innerHTML =
    "<tr><td colspan='8'>Lade Bauanfragen...</td></tr>";

  const {data,error} =
    await client
      .from("bauanfragen")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){

    body.innerHTML = "";

    message.innerHTML =
      "<div class='error'>" +
      "Bauanfragen konnten nicht geladen werden: " +
      error.message +
      "</div>";

    return;
  }

  if(!data || data.length === 0){

    body.innerHTML =
      "<tr><td colspan='8'>Noch keine Bauanfragen vorhanden.</td></tr>";

    return;
  }

  body.innerHTML = "";

  data.forEach(row => {

    const tr =
      document.createElement("tr");

    tr.innerHTML = `
      <td>${escapeHtml(formatDate(row.created_at))}</td>
      <td>${escapeHtml(row.service || "")}</td>
      <td>${escapeHtml(row.plz || "")}</td>
      <td>${escapeHtml(row.area || "")}</td>
      <td>${escapeHtml(row.name || "")}</td>
      <td>${escapeHtml(row.phone || "")}</td>
      <td>${escapeHtml(row.email || "")}</td>
      <td>${escapeHtml(row.status || "")
