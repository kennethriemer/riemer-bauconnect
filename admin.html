<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171717">

<title>Riemer BauConnect – Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#171717;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:950px;
  margin:auto;
  padding:24px 16px 60px;
}

h1{
  margin:0 0 6px;
  font-size:30px;
}

h2{
  margin-top:0;
}

.yellow{
  color:#ffd400;
}

.small{
  color:#aaa;
  margin-bottom:22px;
}

.card{
  background:#222;
  border:1px solid #333;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
}

input,
select,
textarea,
button{
  width:100%;
  padding:14px;
  border-radius:12px;
  font-size:16px;
}

input,
select,
textarea{
  background:#111;
  color:#fff;
  border:1px solid #444;
  margin-bottom:12px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:0;
  background:#ffd400;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:#333;
  color:#fff;
}

button.danger{
  background:#8b2222;
  color:#fff;
}

.hidden{
  display:none;
}

.error{
  background:#4a2020;
  color:#ffb0b0;
  padding:14px;
  border-radius:12px;
  margin-top:12px;
}

.success{
  background:#173d25;
  color:#9ff0b5;
  padding:14px;
  border-radius:12px;
  margin-top:12px;
}

.actions{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.actions button{
  flex:1;
}

.request,
.firm{
  background:#292929;
  border:1px solid #444;
  border-radius:14px;
  padding:16px;
  margin:10px 0;
}

.request{
  cursor:pointer;
}

.request:active,
.firm:active{
  transform:scale(.99);
}

.request-top{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr;
  gap:12px;
}

.label{
  color:#ffd400;
  font-size:13px;
  margin-bottom:4px;
}

.value{
  font-size:17px;
  font-weight:bold;
}

.muted{
  color:#aaa;
  margin-top:4px;
}

.detail{
  background:#292929;
  border-radius:14px;
  padding:18px;
  margin-top:15px;
}

.detail-row{
  padding:13px 0;
  border-bottom:1px solid #444;
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-label{
  color:#ffd400;
  font-size:13px;
  margin-bottom:5px;
}

.detail-value{
  font-size:17px;
  word-break:break-word;
}

.status{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  margin-top:8px;
  font-size:14px;
  font-weight:bold;
}

.status-neu{
  background:#d8aa00;
  color:#111;
}

.status-kontakt{
  background:#2478d8;
  color:#fff;
}

.status-angebot{
  background:#e87818;
  color:#fff;
}

.status-auftrag{
  background:#239447;
  color:#fff;
}

.status-erledigt{
  background:#555;
  color:#fff;
}

.firm-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:8px;
}

.firm-info{
  color:#bbb;
  line-height:1.6;
}

.match{
  border:1px solid #ffd400;
  border-radius:14px;
  padding:15px;
  margin-top:10px;
  background:#252525;
}

.match-title{
  font-size:18px;
  font-weight:bold;
}

.nav{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.nav button{
  flex:1;
}

.login{
  max-width:500px;
  margin:60px auto;
}

@media(max-width:650px){

  .request-top{
    grid-template-columns:1fr;
  }

  .actions{
    flex-direction:column;
  }

  .nav{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>
RIEMER <span class="yellow">BAUCONNECT</span>
</h1>

<div class="small">

</div>

id="email"

<!-- NAVIGATION -->

<div id="requestList"></div>

<div id="listError" class="error hidden"></div>

id="backButton"

</div>

</section>

</div>


<script>

const SUPABASE_URL =
"https://ehzugjmltfcvllftpjpp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ieo0pxh7y8L4nr2xMS7fQQ_mPonnlOm";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ELEMENTE */

const loginCard =
document.getElementById("loginCard");

const adminArea =
document.getElementById("adminArea");

const loginButton =
document.getElementById("loginButton");

const logoutButton =
document.getElementById("logoutButton");

const refreshButton =
document.getElementById("refreshButton");

const requestsTab =
document.getElementById("requestsTab");

const firmsTab =
document.getElementById("firmsTab");

const requestsArea =
document.getElementById("requestsArea");

const firmsArea =
document.getElementById("firmsArea");

const listView =
document.getElementById("listView");

const detailView =
document.getElementById("detailView");

const requestList =
document.getElementById("requestList");

const detailContent =
document.getElementById("detailContent");

const loading =
document.getElementById("loading");

const loginError =
document.getElementById("loginError");

const listError =
document.getElementById("listError");

const firmList =
document.getElementById("firmList");

const firmLoading =
document.getElementById("firmLoading");

const firmForm =
document.getElementById("firmForm");

const firmError =
document.getElementById("firmError");

const firmFormMessage =
document.getElementById("firmFormMessage");


/* SICHERHEIT */

function escapeHtml(value){

if(
value === null ||
value === undefined
){
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* DATUM */

function formatDate(value){

if(!value){
return "-";
}

const date =
new Date(value);

return date.toLocaleString(
"de-DE",
{
dateStyle:"short",
timeStyle:"short"
}
);

}


/* STATUS TEXT */

function statusText(status){

switch(status){

case "kontakt":
return "🔵 Kontakt aufgenommen";

case "angebot":
return "🟠 Angebot";

case "auftrag":
return "🟢 Auftrag";

case "erledigt":
return "⚫ Erledigt";

default:
return "🟡 Neu";

}

}


/* STATUS KLASSE */

function statusClass(status){

switch(status){

case "kontakt":
return "status-kontakt";

case "angebot":
return "status-angebot";

case "auftrag":
return "status-auftrag";

case "erledigt":
return "status-erledigt";

default:
return "status-neu";

}

}


/* SESSION */

async function checkSession(){

const {
data
} =
await db.auth.getSession();

if(data.session){

loginCard.classList.add("hidden");

adminArea.classList.remove("hidden");

loadRequests();

loadFirms();

}else{

loginCard.classList.remove("hidden");

adminArea.classList.add("hidden");

}

}


/* LOGIN */

loginButton.addEventListener(
"click",
async () => {

loginError.classList.add("hidden");

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

if(!email || !password){

loginError.textContent =
"Bitte E-Mail und Passwort eingeben.";

loginError.classList.remove("hidden");

return;

}

loginButton.disabled = true;

loginButton.textContent =
"Einloggen …";

const {
error
} =
await db.auth.signInWithPassword({

email,
password

});

loginButton.disabled = false;

loginButton.textContent =
"Einloggen";

if(error){

loginError.textContent =
"Login fehlgeschlagen: " +
error.message;

loginError.classList.remove("hidden");

return;

}

checkSession();

}
);


/* LOGOUT */

logoutButton.addEventListener(
"click",
async () => {

await db.auth.signOut();

detailView.classList.add("hidden");

listView.classList.remove("hidden");

checkSession();

}
);


/* AKTUALISIEREN */

refreshButton.addEventListener(
"click",
() => {

loadRequests();

loadFirms();

}
);


/* TABS */

requestsTab.addEventListener(
"click",
() => {

requestsArea.classList.remove("hidden");

firmsArea.classList.add("hidden");

requestsTab.classList.remove("secondary");

firmsTab.classList.add("secondary");

}
);


firmsTab.addEventListener(
"click",
() => {

requestsArea.classList.add("hidden");

firmsArea.classList.remove("hidden");

requestsTab.classList.add("secondary");

firmsTab.classList.remove("secondary");

loadFirms();

}
);


/* ZURÜCK */

document
.getElementById("backButton")
.addEventListener(
"click",
() => {

detailView.classList.add("hidden");

listView.classList.remove("hidden");

}
);


/* =========================
   BAUANFRAGEN LADEN
========================= */

async function loadRequests(){

loading.style.display =
"block";

requestList.innerHTML =
"";

listError.classList.add("hidden");

const {
data,
error
} =
await db
.from("bauanfragen")
.select("*")
.order(
"created_at",
{
ascending:false
}
);

loading.style.display =
"none";

if(error){

listError.textContent =
"Fehler beim Laden: " +
error.message;

listError.classList.remove("hidden");

return;

}


if(!data || data.length === 0){

requestList.innerHTML =
'<p class="muted">Noch keine Bauanfragen vorhanden.</p>';

return;

}


data.forEach(
request => {

const item =
document.createElement("div");

item.className =
"request";


item.innerHTML = `

<div class="request-top">

<div>

<div class="label">
Datum
</div>

<div class="value">
${escapeHtml(
formatDate(request.created_at)
)}
</div>

</div>


<div>

<div class="label">
Leistung
</div>

<div class="value">
${escapeHtml(request.service)}
</div>

<div class="muted">
${escapeHtml(
request.description || ""
)}
</div>

</div>


<div>

<div class="label">
PLZ
</div>

<div class="value">
${escapeHtml(request.plz)}
</div>

<span class="status ${
statusClass(request.status)
}">
${escapeHtml(
statusText(request.status)
)}
</span>

</div>

</div>

`;


item.addEventListener(
"click",
() => {

showDetail(request);

}
);


requestList.appendChild(item);

}

);

}


/* =========================
   ANFRAGE DETAIL
========================= */

async function showDetail(request){

listView.classList.add("hidden");

detailView.classList.remove("hidden");


detailContent.innerHTML = `

<div class="detail">

<div class="detail-row">

<div class="detail-label">
Leistung
</div>

<div class="detail-value">
${escapeHtml(request.service)}
</div>

</div>


<div class="detail-row">

<div class="detail-label">
Datum
</div>

<div class="detail-value">
${escapeHtml(
formatDate(request.created_at)
)}
</div>

</div>


<div class="detail-row">

<div class="detail-label">
PLZ
</div>

<div class="detail-value">
${escapeHtml(request.plz)}
</div>

</div>


<div class="detail-row">

<div class="detail-label">
Bereich
</div>

<div class="detail-value">
${escapeHtml(
request.area || "-"
)}
</div>

</div>


<div class="detail-row">

<div class="detail-label">
Beschreibung
</div>

<div class="detail-value">
${escapeHtml(
request.description || "-"
)}
</div>

</div>


<div class="detail-row">

<div class="detail-label">
Kunde
</div>

<div class="detail-value">
${escapeHtml(request.name)}
</div>

</div>


<div class="detail-row">

<div class="detail-label">
Telefon
</div>

<div class="detail-value">
${escapeHtml(request.phone)}
</div>

</div>


<div class="detail-row">

<div class="detail-label">
E-Mail
</div>

<div class="detail-value">
${escapeHtml(
request.email || "-"
)}
</div>

</div>


<div class="detail-row">

<div class="detail-label">
Status
</div>

<select id="requestStatus">

<option value="neu">
🟡 Neu
</option>

<option value="kontakt">
🔵 Kontakt aufgenommen
</option>

<option value="angebot">
🟠 Angebot
</option>

<option value="auftrag">
🟢 Auftrag
</option>

<option value="erledigt">
⚫ Erledigt
</option>

</select>

<button
id="saveStatusButton"
>
Status speichern
</button>

<div
id="statusMessage"
class="hidden"
></div>

</div>


<div class="detail-row">

<div class="detail-label">
Passende Fachbetriebe
</div>

<div id="matches">
Suche passende Fachbetriebe …
</div>

</div>


</div>

`;


const select =
document.getElementById(
"requestStatus"
);

select.value =
request.status || "neu";


document
.getElementById("saveStatusButton")
.addEventListener(
"click",
async () => {

await saveStatus(request);

}
);


loadMatches(request);

}


/* =========================
   STATUS SPEICHERN
========================= */

async function saveStatus(request){

const select =
document.getElementById(
"requestStatus"
);

const message =
document.getElementById(
"statusMessage"
);

const status =
select.value;


message.className =
"success";

message.textContent =
"Speichere …";


const {
error
} =
await db
.from("bauanfragen")
.update({
status:status
})
.eq("id",request.id);


if(error){

message.className =
"error";

message.textContent =
"Fehler: " +
error.message;

return;

}


message.className =
"success";

message.textContent =
"Status erfolgreich gespeichert.";

}


/* =========================
   FACHBETRIEBE LADEN
========================= */

async function loadFirms(){

firmLoading.style.display =
"block";

firmList.innerHTML =
"";

firmError.classList.add("hidden");


const {

error
} =
await db
.from("fachbetriebe")

.order(
"created_at",

</div>

<div class="firm-info">

${firm.ort ?

<br>

📏 Radius:

</div>

`;

}

);

}


/* =========================
   FACHBETRIEB FORMULAR
========================= */

document
.getElementById("newFirmButton")
.addEventListener(
"click",
() => {

firmForm.classList.remove("hidden");

firmFormMessage.className =
"";

firmFormMessage.textContent =
"";

}
);


/* ABBRECHEN */

document
.getElementById("cancelFirmButton")
.addEventListener(
"click",
() => {

firmForm.classList.add("hidden");

}
);


/* =========================
   FACHBETRIEB SPEICHERN
========================= */

document
.getElementById("saveFirmButton")
.addEventListener(
"click",
async () => {

firmFormMessage.className =
"";

firmFormMessage.textContent =
"Speichere …";


const firma =
document
.getElementById("firmName")
.value
.trim();

const inhaber =
document
.getElementById("firmOwner")
.value
.trim();

const email =
document
.getElementById("firmEmail")
.value
.trim();

const telefon =
document
.getElementById("firmPhone")
.value
.trim();

const plz =
document
.getElementById("firmPlz")
.value
.trim();

const ort =
document
.getElementById("firmCity")
.value
.trim();

const leistungen =

.getElementById("firmServices")
.value

const radius =
parseInt(
document
.getElementById("firmRadius")

) || 30;


if(!firma || !plz){

}

error
} =
await db

firma:firma,

inhaber:inhaber,

email:email,

plz:plz,

ort:ort,

});


if(error){

firmFormMessage.className =
"error";

firmFormMessage.textContent =
"Fehler: " +
error.message;

return;

}


firmFormMessage.className =

firmFormMessage.textContent =
"Fachbetrieb erfolgreich gespeichert.";


/* FELDER LEEREN */

document
.getElementById("firmName")
.value="";

document
.getElementById("firmOwner")
.value="";

document
.getElementById("firmEmail")
.value="";

document
.getElementById("firmPhone")
.value="";

document
.getElementById("firmPlz")
.value="";

document
.getElementById("firmCity")
.value="";

document
.getElementById("firmServices")
.value="";

document
.getElementById("firmRadius")
.value="30";


loadFirms();

}
);


/* =========================
   MATCHING
========================= */

async function loadMatches(request){

const container =
document.getElementById("matches");

if(!container){
return;
}


const {
data,
error
} =
await db
.from("fachbetriebe")
.select("*");


if(error){

container.innerHTML =
`<div class="error">
${escapeHtml(error.message)}
</div>`;

return;

}


const requestPlz =
String(
request.plz || ""
).trim();


const service =
String(
request.service || ""
).toLowerCase();


const firms =
(data || [])
.filter(
firm => {

const firmPlz =
String(
firm.plz || ""
).trim();

const services =
String(
firm.leistungen || ""
).toLowerCase();


const plzMatch =
firmPlz.substring(0,2) ===
requestPlz.substring(0,2);


const serviceWords =
service
.split(/[\s,/]+/)
.filter(word =>
word.length > 3
);


const serviceMatch =
serviceWords.length === 0
||
serviceWords.some(
word =>
services.includes(word)
);


return plzMatch && serviceMatch;

}
);


if(firms.length === 0){

container.innerHTML =
`<p class="muted">
Keine passenden Fachbetriebe gefunden.
</p>`;

return;

}


container.innerHTML =
"";


firms.forEach(
firm => {

const match =
document.createElement("div");

match.className =
"match";


match.innerHTML = `

<div class="match-title">
🏢 ${escapeHtml(
firm.firma || "-"
)}
</div>

<div class="firm-info">

📍 ${escapeHtml(
firm.plz || "-"
)}
${firm.ort ?
" – " +
escapeHtml(firm.ort)
:
""}
